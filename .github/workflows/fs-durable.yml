name: fs-durable

on:
  push:
    branches: [main]
    paths:
      - "packages/fs-durable/**"
      - "tools/oxlint/**"
      - ".oxlintrc.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/fs-durable.yml"
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fs-durable: ${{ steps.filter.outputs.fs-durable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "fs-durable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          pattern='^(packages/fs-durable/|tools/oxlint/|\.oxlintrc\.json$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.json$|\.github/workflows/fs-durable\.yml$)'
          if printf '%s\n' "$files" | grep -qE "$pattern"; then
            echo "fs-durable=true" >> "$GITHUB_OUTPUT"
          else
            echo "fs-durable=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.fs-durable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter fs-durable-workspace --filter fs-durable

      - name: Lint
        run: pnpm exec oxlint packages/fs-durable

      - name: Typecheck
        run: pnpm --filter fs-durable typecheck

      - name: Build
        run: pnpm --filter fs-durable build

      - name: Test
        run: pnpm --filter fs-durable test

  result:
    name: fs-durable result
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required job finished with: $result"; exit 1 ;;
            esac
          done
