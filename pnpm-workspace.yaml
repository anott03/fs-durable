packages:
  - packages/*

# Keep Alchemy's compatible Effect adapters aligned with Foldkit's exact 4.0.0 pin.
overrides:
  "@alchemy.run/cloudflare-runtime>workerd": "1.20261019.1"
  "alchemy>@effect/sql-d1": "4.0.0"
  "alchemy>@effect/sql-sqlite-do": "4.0.0"
  "@effect/platform-node@4.0.0>@effect/platform-node-shared": "4.0.0"
  "@effect/platform-bun@4.0.0>@effect/platform-node-shared": "4.0.0"
  vite@*: "catalog:"
  vitest@*: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
